<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalyst Workspace</title>

    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #181b24;
            --accent: #6366f1;
            --text: #f3f4f6;
            --border: #2e3440;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 300px;
        }

        .preview {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: #fff;
        }

        .url-bar {
            background: var(--bg-secondary);
            padding: 8px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .url-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
        }

        .url-bar button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .url-bar button:hover {
            opacity: 0.9;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        .logs {
            background: var(--bg-secondary);
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 6px;
            border-left: 3px solid var(--accent);
            background: rgba(0, 0, 0, 0.2);
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
        }

        .connection-error {
            border-left-color: var(--error);
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 150px;
            }

            .preview {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>

<header>
    <div style="font-weight: bold; letter-spacing: 1px;">
        CATALYST
    </div>

    <div class="status" id="status">
        <div class="dot"></div>
        <span id="status-text">Connecting...</span>
    </div>
</header>

<div class="workspace">

    <div class="preview">

        <div class="url-bar">
            <input
                type="text"
                id="target"
                placeholder="/preview/";
            />

            <button onclick="reloadFrame()">
                Reload
            </button>
        </div>

        <iframe
            id="frame"
            src="about:blank">
        </iframe>

    </div>

    <div class="logs" id="logs">

        <div class="log-entry">
            Connecting to Catalyst...
        </div>

    </div>

</div>

<script>

const frame = document.getElementById('frame');
const target = document.getElementById('target');
const logs = document.getElementById('logs');
const statusText = document.getElementById('status-text');


// TARGET URL


const savedTarget =
    localStorage.getItem('catalystTarget');

if (savedTarget) {
    target.value = savedTarget;
} else {
    target.value = '/preview/';
}

// LOGGING

function addLog(message, isError = false) {

    const div = document.createElement('div');

    div.className = 'log-entry';

    if (isError) {
        div.classList.add('connection-error');
    }

    div.innerText = message;

    logs.prepend(div);
}


// --------------------------------------------------
// PREVIEW RELOAD
// --------------------------------------------------

function reloadFrame() {

    const url = target.value.trim();

    if (!url) {
        return;
    }

    localStorage.setItem(
        'catalystTarget',
        url
    );

    /*
     * Add a cache-busting parameter.
     *
     * Example:
     *
     * http://localhost:8000
     *
     * becomes:
     *
     * http://localhost:8000?catalyst=123456789
     *
     * This forces the browser to request
     * fresh HTML/CSS/JS.
     */

    const separator =
        url.includes('?') ? '&' : '?';

    const cacheBust =
        `${separator}catalyst=${Date.now()}`;

    frame.src = url + cacheBust;
}

// TARGET URL CHANGED


target.addEventListener('change', () => {

    localStorage.setItem(
        'catalystTarget',
        target.value.trim()
    );

    reloadFrame();

});

// WEBSOCKET

let ws = null;

function connect() {

    const protocol =
        window.location.protocol === 'https:'
            ? 'wss:'
            : 'ws:';

    const wsUrl =
        `${protocol}//${window.location.host}/ws`;

    console.log(
        'Connecting to:',
        wsUrl
    );

    ws = new WebSocket(wsUrl);

    // CONNECTED
    

    ws.onopen = () => {

        statusText.innerText =
            'Listening';

        addLog(
            'WebSocket connected'
        );

        /*
         * Load the saved target when
         * the WebSocket connection succeeds.
         */

        if (
            frame.src === 'about:blank'
        ) {

            reloadFrame();

        }

    };


    // -----------------------------
    // MESSAGE
    // -----------------------------

    ws.onmessage = (event) => {

        try {

            const data =
                JSON.parse(event.data);

            console.log(
                'WebSocket event:',
                data
            );


            if (
                data.type ===
                'FILE_CHANGED'
            ) {

                const timestamp =
                    data.payload.timestamp;

                const filename =
                    data.payload.file;


                addLog(
                    `[${timestamp}] Saved: ${filename}`
                );


                /*
                 * Automatically refresh
                 * the preview.
                 */

                reloadFrame();

            }

        } catch (error) {

            console.error(
                'Invalid WebSocket message:',
                error
            );

        }

    };

    // CONNECTION CLOSED

    ws.onclose = () => {

        statusText.innerText =
            'Reconnecting...';

        addLog(
            'WebSocket disconnected',
            true
        );

        setTimeout(
            connect,
            2000
        );

    };

    // CONNECTION ERROR
    ws.onerror = (error) => {

        console.error(
            'WebSocket error:',
            error
        );

        statusText.innerText =
            'Connection Error';

    };

}
// START
connect();

</script>

</body>
</html>
